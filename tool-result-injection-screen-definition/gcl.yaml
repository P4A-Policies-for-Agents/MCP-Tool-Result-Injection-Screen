---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: Extension
metadata:
  labels:
    title: MCP Tool-Result Injection Screen
    category: MCP
    description: >-
      Screens untrusted text an MCP tools/call returns for prompt injection
      before the agent acts on it — pre-checks plus a typed Jev judge (no
      generated text). Withholds, quarantines or flags an injected result;
      benign passes through. MCP, REST, HTTP.
    metadata/capabilities/injectionPoint: outbound
    metadata/capabilities/assetTypes: mcp,rest,http
    metadata/interfaceScope: api,resource
spec:
  extends:
    - name: extension-definition
      namespace: default
  properties:
    # ── Operating mode (jev-policy-common) ──────────────────────────────────
    mode:
      type: string
      enum: [enforce, shadow, off]
      default: shadow
      description: >-
        enforce applies the decision (withhold/quarantine/flag). shadow (default
        for first deployment) computes and logs the decision but never mutates
        the response. off passes through without calling the judge.
    failMode:
      type: string
      enum: [open, closed]
      default: open
      description: >-
        On a judge error or timeout, open passes the tool result through
        (decision logged as unavailable); closed withholds it with reason
        decision_unavailable. Recommend closed for routes whose tools fetch
        arbitrary external content (web, email).
    # ── Judge (jev-client) ──────────────────────────────────────────────────
    jevProvider:
      type: string
      enum: [mock, typesafe, openai, openrouter, litellm, cloudflare, custom]
      default: typesafe
      description: >-
        System-One judge provider. typesafe = TypeSafe Jev noul/choice API.
        openai/openrouter/litellm/custom = an OpenAI-compatible chat endpoint
        driven as a typed JSON judge. mock = deterministic in-policy judge for
        tests and offline demos (requires allowMock: true).
    jevService:
      type: string
      format: service
      description: >-
        Base URL of the judge provider (e.g. https://openrouter.ai or the
        TypeSafe System One host). Required even for mock (any reachable URL);
        the mock provider never calls it.
    jevPath:
      type: string
      description: >-
        Optional path override for the judge endpoint. Defaults per provider
        (e.g. /api/v1/chat/completions for OpenAI-compatible providers).
    jevApiKey:
      type: string
      description: API key / bearer token for the judge provider. Not needed for mock.
      "@context": { "@characteristics": [security:sensitive] }
    jevModel:
      type: string
      default: "~typesafe/jev-latest"
      description: >-
        Judge model id. Defaults to the latest TypeSafe Jev model. For
        OpenAI-compatible providers set your chat model (e.g. openai/gpt-4o-mini).
        Ignored for cloudflare and mock.
    cloudflareAccountId:
      type: string
      description: Cloudflare account id (only when jevProvider is cloudflare).
    customAuthHeader:
      type: string
      default: "Authorization"
      description: Header carrying the credential when jevProvider is custom.
    jevTimeoutMs:
      type: integer
      default: 600
      minimum: 1
      description: Per-call judge timeout (ms). Jev is typically 70-500 ms end to end.
    maxStateTokens:
      type: integer
      default: 24000
      minimum: 256
      description: >-
        Approximate token budget (chars/4) for the untrusted text sent to the
        judge; longer text is truncated head+tail with a gateway marker.
    minConfidence:
      type: number
      default: 0.6
      minimum: 0
      maximum: 1
      description: Choice answers below this confidence are treated as uncertain.
    # ── Header / logging conventions (jev-policy-common) ────────────────────
    stripClientJevHeaders:
      type: boolean
      default: true
      description: >-
        Strip inbound x-jev-* headers from the client request so a client cannot
        spoof a decision consumed by a later policy on the chain.
    logStateSample:
      type: boolean
      default: false
      description: >-
        Log a short (truncated) sample of the screened text at debug level. Off
        by default (screened text can contain personal data); the decision log
        otherwise records only an FNV-1a fingerprint of the state.
    sampleRate:
      type: number
      default: 1.0
      minimum: 0
      maximum: 1
      description: Fraction of eligible tool results actually screened (1.0 = all).
    allowMock:
      type: boolean
      default: false
      description: Permit jevProvider = mock. Guard so mock is never used unintentionally in production.
    # ── Screening scope / deterministic pre-checks (S1-specific) ────────────
    assetType:
      type: string
      enum: [mcp, rest, http, auto]
      default: auto
      description: >-
        What kind of response to screen. mcp screens JSON-RPC tools/call results;
        rest/http screen a JSON or text response body; auto (default) detects
        MCP JSON-RPC by envelope and treats everything else as rest/http.
    trustedTools:
      type: array
      items:
        type: string
      default: []
      description: >-
        Glob list of MCP tool names whose results are trusted and skipped
        (e.g. internal_* or a specific safe tool). Case-sensitive.
    routes:
      type: array
      items:
        type: string
      default: []
      description: >-
        For rest/http, optional path-prefix allowlist of routes to screen. Empty
        (default) screens every matched response. (Prefixes match on segment
        boundaries.)
    screenResourceText:
      type: boolean
      default: true
      description: >-
        Also screen text inside embedded MCP resource content items, not only
        top-level content[].text.
    precheckPatterns:
      type: array
      items:
        type: string
      default: []
      description: >-
        Extra case-insensitive phrases (substring match) that pre-flag a result.
        Merged with the built-in defaults (ignore previous instructions, you are
        now, system prompt, hidden-text markers). A pre-check hit sets
        precheck_hit but does not block by itself unless blockOnPrecheckHit is true.
    blockOnPrecheckHit:
      type: boolean
      default: false
      description: Treat a deterministic pre-check hit as a block on its own, without waiting for the judge.
    onBlock:
      type: string
      enum: [withhold, quarantine, flag]
      default: withhold
      description: >-
        withhold replaces the result with a valid MCP error result (isError:true)
        explaining the gateway withheld it. quarantine keeps the content but
        prepends a warning that it may contain instructions aimed at the agent.
        flag passes it unchanged and only records the decision in the log.
    directiveWeight:
      type: number
      default: 1.0
      minimum: 0
      maximum: 1
      description: Weight of the agent-directive signal in the injection score.
    actionRequestWeight:
      type: number
      default: 0.8
      minimum: 0
      maximum: 1
      description: Weight of the action-request signal in the injection score.
    flagAt:
      type: number
      default: 0.5
      minimum: 0
      maximum: 1
      description: Injection score at or above which the result is flagged.
    blockAt:
      type: number
      default: 0.85
      minimum: 0
      maximum: 1
      description: Injection score at or above which the result is blocked (must be >= flagAt).
    attackTypeFloor:
      type: number
      default: 0.7
      minimum: 0
      maximum: 1
      description: >-
        When the judge picks a concrete attack type (override / tool_invocation /
        data_exfiltration / credential_request) with confidence >= minConfidence,
        the injection score is floored at this value.
    hiddenTextBoost:
      type: number
      default: 0.1
      minimum: 0
      maximum: 1
      description: Added to the injection score when the result contained hidden text (zero-width chars, HTML comments).
    maxBodyBytes:
      type: integer
      default: 1048576
      minimum: 0
      description: >-
        Response bodies larger than this (bytes) are not screened; onOversize
        decides what happens. Default 1 MiB.
    onOversize:
      type: string
      enum: [skip, block]
      default: skip
      description: What to do when a response exceeds maxBodyBytes. skip passes through unscreened (decision logged as skipped_oversize); block withholds.
  required:
    - jevService
