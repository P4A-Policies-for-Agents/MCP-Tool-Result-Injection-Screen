[package]
name = "tool_result_injection_screen"
version = "1.0.3"
rust-version = "1.88.0"
edition = "2018"
resolver = "2"

[package.metadata.anypoint]
group_id = "030e0aac-30d9-460f-9234-428c16a123c4"
definition_asset_id = { name = "mcp-tool-result-injection-screen", version = "1.0.3" }
implementation_asset_id = "tool-result-injection-screen-flex"

[dependencies]
# enable_stop_iteration: this policy screens a single-shot response body and may
# rewrite it (withhold/quarantine). It buffers the whole response before deciding,
# so it needs the stop-iteration capability to hold the body while calling the judge.
pdk = { version = "1.10.0", features = ["enable_stop_iteration"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
anyhow = "1.0"

[dev-dependencies]
pdk-test = { version = "1.10.0" }
httpmock = "0.6"
reqwest = "0.11"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
opt-level = 'z'
strip = "debuginfo"
